[package]
name = "myde-wrap"
version = "0.1.0"
edition = "2021"

[dependencies]
smithay = { version = "0.7", features = ["backend_winit", "backend_drm", "backend_gbm", "backend_udev", "renderer_gl", "wayland_frontend", "desktop"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
signal-hook = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
drm = "0.14"
gbm = "0.18"
nix = { version = "0.29", features = ["mman", "signal", "process", "time", "socket", "user"] }
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }
