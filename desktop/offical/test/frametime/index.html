<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帧时间图表</title>
    <style>
        html,
        body {
            margin: 0;
            background: #f2f2f4;
            color: #111;
            font-family: sans-serif;
        }

        .page {
            max-width: 920px;
            margin: 0 auto;
            padding: 28px 24px 48px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            line-height: 1.3;
        }

        .desc {
            margin: 0;
            font-size: 13px;
            line-height: 1.6;
            opacity: 0.65;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 14px;
            padding: 12px 14px;
            border-radius: 12px;
            background: #ffffffb8;
        }

        .toolbar label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        select,
        button {
            font: 12px/1.4 sans-serif;
            color: #111;
            background: #fff;
            border: 1px solid #00000024;
            border-radius: 7px;
            padding: 4px 8px;
        }

        button {
            cursor: pointer;
        }

        button:active {
            background: #eef6ff;
        }

        .spacer {
            flex: 1 1 auto;
        }

        .hint {
            margin: 0;
            font-size: 12px;
            line-height: 1.6;
            opacity: 0.6;
        }

        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
            padding: 1px 4px;
            border-radius: 4px;
            background: #00000010;
        }

        #measured {
            font-size: 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            opacity: 0.7;
            min-width: 150px;
        }

        #chart {
            padding: 12px 14px;
            border-radius: 12px;
            background: #ffffffcc;
        }
    </style>
</head>

<body>
    <div class="page">
        <h1>帧时间图表</h1>
        <p class="desc">
            采样当前页面 requestAnimationFrame 的帧间隔。目标预算线按所选刷新率计算；持续负载或一次性长帧会让竖条超过预算，用来确认图表能抓到掉帧。
            官方桌面「设置 → 显示」里是同一份图表。
        </p>
        <div class="toolbar">
            <label>窗口
                <select id="window-size">
                    <option value="2000">2 秒</option>
                    <option value="4000">4 秒</option>
                    <option value="6000" selected>6 秒</option>
                    <option value="10000">10 秒</option>
                    <option value="20000">20 秒</option>
                </select>
            </label>
            <label>目标刷新率
                <select id="refresh-rate">
                    <option value="60">60 Hz</option>
                    <option value="75">75 Hz</option>
                    <option value="90">90 Hz</option>
                    <option value="100">100 Hz</option>
                    <option value="120" selected>120 Hz</option>
                    <option value="144">144 Hz</option>
                    <option value="165">165 Hz</option>
                    <option value="240">240 Hz</option>
                </select>
            </label>
            <button id="measure" type="button">实测刷新率</button>
            <span id="measured">尚未实测</span>
            <span class="spacer"></span>
            <label>持续负载
                <select id="load">
                    <option value="0" selected>0 ms/帧</option>
                    <option value="4">4 ms/帧</option>
                    <option value="8">8 ms/帧</option>
                    <option value="12">12 ms/帧</option>
                    <option value="20">20 ms/帧</option>
                </select>
            </label>
            <button id="spike-20" type="button">塞 20ms 长帧</button>
            <button id="spike-50" type="button">50ms</button>
            <button id="spike-100" type="button">100ms</button>
        </div>
        <div id="chart"></div>
        <p class="hint">
            启动：<code>pnpm test:frametime</code>（或 <code>npx vite desktop/offical/test/frametime</code>），
            然后在 myde 里用浏览器打开终端输出的地址。持续负载会占用每帧的主线程时间：超过帧预算时 rAF 间隔翻倍，图表出现成倍的长帧；
            不停留长帧说明预算充足。实测刷新率取 30 帧间隔的中位数，再吸附到常见刷新率。
        </p>
    </div>
    <script type="module" src="./frametime_demo.ts"></script>
</body>

</html>
