name: Build/release

on:
    push:
        tags:
            - "*"

env:
    # myde-wrap 固定版本（完整 commit hash），与 script/myde_wrap/build.sh 的默认值一致
    MYDE_WRAP_REF: 983fbc7f0157bc8e3af1a1a522230605c273a3b6

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Check out Git repository
              uses: actions/checkout@v1

            - name: Install Node.js, NPM and Yarn
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache myde-wrap target
              uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/myde-wrap/target
                  key: myde-wrap-${{ runner.os }}-${{ env.MYDE_WRAP_REF }}

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libx11-dev libxext-dev libxtst-dev libxrender-dev libxmu-dev libxmuu-dev rpm
                  sudo apt-get install -y pkg-config libdrm-dev libgbm-dev libudev-dev libinput-dev libseat-dev libpixman-1-dev libxkbcommon-dev

            - name: Build myde-wrap
              env:
                  MYDE_WRAP_DIR: ${{ runner.temp }}/myde-wrap
              run: bash script/myde_wrap/build.sh

            - name: Build (Linux x64)
              env:
                  M_ARCH: x64
                  USE_HARD_LINKS: false
              run: |
                  npm install
                  cd desktop/offical
                  npm install
                  npm run build
                  cd ..
                  npm run dist

            - name: release
              uses: softprops/action-gh-release@v2
              with:
                  files: "build/*"
                  draft: false
                  prerelease: true
                  generate_release_notes: true
